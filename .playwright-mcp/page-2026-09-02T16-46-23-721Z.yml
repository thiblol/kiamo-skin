            - text: · Procell Microchanneling
          - heading "Procell Microchanneling — stimulate your skin's natural repair process." [level=1] [ref=f19e21]
          - paragraph [ref=f19e22]:
            - text: Looking for microneedling in San Diego? Procell microchanneling is the alternative offered here — a different modality from a needle pen, performed by a licensed esthetician in Mission Hills,
            - link "with depth adjusted for melanin-rich skin" [ref=f19e23] [cursor=pointer]:
              - /url: /journal/microneedling-on-dark-skin-san-diego/
            - text: .
          - paragraph [ref=f19e24]:
            - text: Procell Microchanneling creates controlled microchannels that activate your skin's natural repair response while delivering a specialized growth factor serum. Over time, new collagen helps improve acne scars, fine lines, wrinkles, and uneven skin texture for smoother, healthier-looking skin. Every treatment is customized for your skin goals and skin tone. For clients traveling from
            - link "Carlsbad" [ref=f19e25] [cursor=pointer]:
              - /url: /service-areas/carlsbad/
            - text: ","
            - link "Del Mar" [ref=f19e26] [cursor=pointer]:
              - /url: /service-areas/del-mar/
            - text: ", or"
            - link "Encinitas" [ref=f19e27] [cursor=pointer]:
              - /url: /service-areas/encinitas/
            - text: ", the series is planned as a block at consultation—scheduling all three sessions at once accounts for the drive and makes completion realistic."
          - generic [ref=f19e28]:
            - link "Request Appointment" [ref=f19e29] [cursor=pointer]:
              - /url: https://www.vagaro.com/kiamoskin
            - link "(310) 595-0872" [ref=f19e30] [cursor=pointer]:
              - /url: tel:+13105950872
          - paragraph [ref=f19e31]: Licensed Esthetician · Licensed Esthetician · 7+ years experience · One-to-one, private studio
        - generic [ref=f19e32]:
