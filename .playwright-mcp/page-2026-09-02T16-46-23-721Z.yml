      - paragraph [ref=f19e38]:
        - text: Procell Microchanneling is performed at the Mission Hills studio. Clients travel from
        - link "across San Diego County" [ref=f19e39] [cursor=pointer]:
          - /url: /service-areas/
        - text: — from nearby neighborhoods like North Park and Hillcrest to coastal areas including La Jolla, Pacific Beach and Encinitas, and inland communities like Chula Vista and La Mesa.
      - generic [ref=f19e41]:
        - generic [ref=f19e42]:
          - generic [ref=f19e43]:
            - heading "What happens in the room" [level=2] [ref=f19e44]
            - list [ref=f19e45]:
              - listitem [ref=f19e46]:
                - paragraph [ref=f19e47]: "01"
                - heading "Prepare" [level=3] [ref=f19e48]
                - paragraph [ref=f19e49]: Your skin is thoroughly cleansed and prepared before treatment. Every Procell session is customized to your skin goals and concerns.
              - listitem [ref=f19e50]:
                - paragraph [ref=f19e51]: "02"
                - heading "The pass" [level=3] [ref=f19e52]
                - paragraph [ref=f19e53]: Treatment depth is adjusted for each area of your skin — deeper where correction is needed and lighter where skin is naturally thinner. A specialized growth factor serum is applied throughout the treatment to support your skin's natural repair process.
              - listitem [ref=f19e54]:
                - paragraph [ref=f19e55]: "03"
                - heading "Recover" [level=3] [ref=f19e56]
                - paragraph [ref=f19e57]: Expect redness similar to a mild sunburn for 24-48 hours. Mild dryness or flaking may occur as your skin renews itself. Following your post-care instructions including daily SPF is essential to support healing and help minimize the risk of unwanted pigmentation, especially in melanin rich skin.
          - generic [ref=f19e58]:
            - heading "Ideal for" [level=2] [ref=f19e59]
            - list [ref=f19e60]:
              - listitem [ref=f19e61]:
                - generic [aria-hidden] [ref=f19e62]: —
                - generic [ref=f19e63]: Acne scars and uneven skin texture
              - listitem [ref=f19e64]:
                - generic [aria-hidden] [ref=f19e65]: —
                - generic [ref=f19e66]: Enlarged pores and rough skin texture
              - listitem [ref=f19e67]:
                - generic [aria-hidden] [ref=f19e68]: —
                - generic [ref=f19e69]: Fine lines and early loss of firmness
              - listitem [ref=f19e70]:
                - generic [aria-hidden] [ref=f19e71]: —
                - generic [ref=f19e72]: Skin that benefits from collagen stimulation without heat or light
        - complementary [ref=f19e73]:
