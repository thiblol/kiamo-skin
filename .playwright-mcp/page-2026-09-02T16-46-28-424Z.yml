            - text: · Lira Chemical Peels
          - heading "Lira Chemical Peels — designed to brighten without compromising skin health." [level=1] [ref=f20e21]
          - paragraph [ref=f20e22]: Looking for a chemical peel in San Diego that is safe on melanin-rich skin? That is the work this studio was built around.
          - paragraph [ref=f20e23]:
            - text: Pigmentation is the reason most people book, and it is also where the wrong treatment does lasting damage. Melanin-rich skin responds to trauma by producing more pigment, so the strength, the acid and the pacing all have to be selected deliberately. Lira's professional range is built for that kind of control.
            - link "Chula Vista clients" [ref=f20e24] [cursor=pointer]:
              - /url: /service-areas/chula-vista/
            - text: and those from
            - link "La Mesa" [ref=f20e25] [cursor=pointer]:
              - /url: /service-areas/la-mesa/
            - text: book this treatment most often, where inland UV and melanin-rich skin demographics make melasma the county's most common pigmentation concern. Read more about
            - link "correcting melasma and post-inflammatory hyperpigmentation" [ref=f20e26] [cursor=pointer]:
              - /url: /treatments/melasma/
            - text: .
