                - definition [ref=f20e81]: $299
            - paragraph [ref=f20e82]: Peel strength is matched to your skin at consultation. The Gentle Renewal Peel refreshes and maintains; the Advanced Peel goes deeper for pigmentation and scarring. Pigmentation is treated as a series with home care between visits — there is no single-session version of this.
            - paragraph [ref=f20e83]:
              - text: Peels on Black and brown skin are chosen differently — the pacing is the whole point.
