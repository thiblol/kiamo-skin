      - paragraph [ref=f20e37]:
        - text: Lira Chemical Peels is performed at the Mission Hills studio. Clients travel from
        - link "across San Diego County" [ref=f20e38] [cursor=pointer]:
          - /url: /service-areas/
        - text: — from nearby neighborhoods like North Park and Hillcrest to coastal areas including La Jolla, Pacific Beach and Encinitas, and inland communities like Chula Vista and La Mesa.
      - generic [ref=f20e40]:
        - generic [ref=f20e41]:
          - generic [ref=f20e42]:
            - heading "What happens in the room" [level=2] [ref=f20e43]
            - list [ref=f20e44]:
              - listitem [ref=f20e45]:
                - paragraph [ref=f20e46]: "01"
                - heading "Patch and prep" [level=3] [ref=f20e47]
                - paragraph [ref=f20e48]: Most pigmentation plans begin with a period of home prep so the skin is ready before any acid is applied.
              - listitem [ref=f20e49]:
                - paragraph [ref=f20e50]: "02"
                - heading "Apply" [level=3] [ref=f20e51]
                - paragraph [ref=f20e52]: The peel is layered and timed to your skins response on the day. Strength escalates across a series rather than in one visit.
              - listitem [ref=f20e53]:
                - paragraph [ref=f20e54]: "03"
                - heading "Protect" [level=3] [ref=f20e55]
                - paragraph [ref=f20e56]: Daily SPF is what holds the result. Without it, pigmentation returns — and San Diegos overcast mornings are the usual reason people stop applying it.
