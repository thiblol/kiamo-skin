  - main [ref=f11e13]:
    - generic [ref=f11e15]:
      - paragraph [ref=f11e16]: About
      - heading "A studio built around correction." [level=1] [ref=f11e17]
      - paragraph [ref=f11e18]: At KIAMO Skin, we believe correction begins by understanding what’s causing the concern not simply covering it up. Every treatment is designed to strengthen the skin and scalp from the inside out through advanced technology, evidence based care, and personalized treatment plans that evolve with you.
    - generic [ref=f11e20]:
      - img "Kiki, licensed esthetician and owner of KIAMO Skin" [ref=f11e22]
      - generic [ref=f11e23]:
        - paragraph [ref=f11e24]: Kiki
        - heading "Licensed Esthetician, California Board of Barbering & Cosmetology" [level=2] [ref=f11e25]
        - paragraph [ref=f11e26]: Practicing corrective skincare since 2019, I combine advanced clinical treatments with individualized treatment planning. Every recommendation is intentional, based on your skin’s current condition, long-term goals, and what will deliver the healthiest results not simply the most aggressive treatment.
        - blockquote [ref=f11e27]: This isn’t just a spa facial. This is strategy, correction, intention.
        - link "See the treatments" [ref=f11e29] [cursor=pointer]:
          - /url: /treatments/
    - generic [ref=f11e31]:
      - paragraph [ref=f11e32]: How we work
      - heading "An inclusive space where everyone feels seen." [level=2] [ref=f11e33]
      - paragraph [ref=f11e34]: At KIAMO Skin, we are proud to be a Black-owned business committed to creating an inclusive space where everyone feels seen, valued, and cared for.
      - paragraph [ref=f11e35]:
        - link "Facials for melanin-rich skin in San Diego" [ref=f11e36] [cursor=pointer]:
          - /url: /melanin-rich-skin/
        - text: are the specialism the studio was built around.
      - list [ref=f11e37]:
        - listitem [ref=f11e38]:
          - paragraph [ref=f11e39]: "01"
          - heading "Education first" [level=3] [ref=f11e40]
          - paragraph [ref=f11e41]: You should leave knowing what was done and why, and what to do at home. A treatment you do not understand is a treatment you will not repeat correctly.
        - listitem [ref=f11e42]:
          - paragraph [ref=f11e43]: "02"
          - heading "Melanin-rich expertise" [level=3] [ref=f11e44]
          - paragraph [ref=f11e45]: Every treatment protocol is thoughtfully selected to support all skin tones, with specialized expertise in the unique needs of melanin-rich skin.
        - listitem [ref=f11e46]:
          - paragraph [ref=f11e47]: "03"
          - heading "Consistency over intensity" [level=3] [ref=f11e48]
          - paragraph [ref=f11e49]: Skin does not change overnight. A sensible plan followed for months beats an aggressive treatment followed by nothing.
      - paragraph [ref=f11e50]:
        - text: A plan followed for months is what the
        - link "monthly skin membership" [ref=f11e51] [cursor=pointer]:
          - /url: /membership/
        - text: is built to make possible.
      - paragraph [ref=f11e52]:
        - text: The approach to pigmentation starts with
        - link "knowing which kind of dark mark you have" [ref=f11e53] [cursor=pointer]:
          - /url: /journal/three-kinds-of-dark-mark/
        - text: .
