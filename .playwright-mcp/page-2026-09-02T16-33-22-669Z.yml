          - heading "HydraFacial — the foundation of healthy skin." [level=1] [ref=f4e21]
          - paragraph [ref=f4e22]: Looking for a HydraFacial in San Diego? KIAMO SKIN is a licensed corrective skin studio in Mission Hills, five minutes from Hillcrest and Little Italy, and the HydraFacial here is $259.
          - paragraph [ref=f4e23]:
            - text: "HydraFacial does three things at once: lifts away dead surface cells, vacuums out congestion, and floods the skin with serum while it is still open enough to take it. It is the most forgiving corrective treatment on the menu, which is why it is usually where a new plan starts."
            - link "Mission Hills clients" [ref=f4e24] [cursor=pointer]:
              - /url: /service-areas/mission-hills/
            - text: are steps from the studio, while those from
            - link "North Park" [ref=f4e25] [cursor=pointer]:
