    - generic [ref=f2e15]:
      - paragraph [ref=f2e16]: Treatments
      - heading "Every step has a purpose." [level=1] [ref=f2e17]
      - paragraph [ref=f2e18]:
        - text: At KIAMO, we don’t believe the most aggressive treatment is always the best treatment. Healthy skin is built through consistency, not constantly switching modalities — which is why most plans here run on a
        - link "monthly facial membership in San Diego" [ref=f2e19] [cursor=pointer]:
          - /url: /membership/
        - text: rather than one appointment at a time.
      - paragraph [ref=f2e20]: HydraFacial serves as the foundation of many of our treatment plans, helping restore and maintain healthy skin over time. As your skin changes, advanced corrective treatments such as Procell Microchanneling, DMK Enzyme Therapy, chemical peels, or Keravive may be introduced when they’re appropriate — not simply because they’re available.
      - paragraph [ref=f2e21]:
        - text: Every recommendation is based on what your skin needs today, while keeping your long-term goals in mind. Protocols are selected to support all skin tones. Kiki's advanced training in treating pigmentation in deeper skin means clients with any skin tone receive the safest, most effective care—whether you're addressing
        - link "melasma, post-inflammatory hyperpigmentation" [ref=f2e22] [cursor=pointer]:
          - /url: /treatments/melasma/
        - text: ", or uneven texture."
