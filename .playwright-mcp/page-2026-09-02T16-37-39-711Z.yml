            - generic [ref=f7e76]:
              - generic [ref=f7e77]:
                - term [ref=f7e78]: Procell Microchanneling
                - definition [ref=f7e79]: $475
                - definition [ref=f7e80]: The best results are typically achieved with a series rather than a single treatment. Most clients begin with three sessions spaced 4-6 weeks apart, though your treatment plan is customized during your consultation based on your skin goals, concerns, and how your skin responds.
              - generic [ref=f7e81]:
                - term [ref=f7e82]: Procell Microchanneling 3-Treatment Series
                - definition [ref=f7e83]: $1,199
                - definition [ref=f7e84]: Designed for clients committed to long-term correction. A series of three treatments supports progressive collagen remodeling and is recommended for concerns such as acne scars, uneven texture, fine lines, and overall skin rejuvenation. Treatments are typically scheduled 4-6 weeks apart.
            - paragraph [ref=f7e85]:
              - text: Microchanneling works without heat or light, which matters on melanin-rich skin because heat is itself a pigment trigger.
              - link "Facials for melanin-rich skin in San Diego" [ref=f7e86] [cursor=pointer]:
                - /url: /melanin-rich-skin/
              - text: .
            - paragraph [ref=f7e87]:
              - text: A series of three is the usual plan, and membership treatments can be applied to it by paying the difference.
