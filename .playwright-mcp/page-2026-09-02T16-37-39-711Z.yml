      - paragraph [ref=f7e38]:
        - text: Procell Microchanneling is performed at the Mission Hills studio. Clients travel from
        - link "across San Diego County" [ref=f7e39] [cursor=pointer]:
          - /url: /service-areas/
        - text: — from nearby neighborhoods like North Park and Hillcrest to coastal areas including La Jolla, Pacific Beach and Encinitas, and inland communities like Chula Vista and La Mesa.
      - generic [ref=f7e41]:
        - generic [ref=f7e42]:
          - generic [ref=f7e43]:
            - heading "What happens in the room" [level=2] [ref=f7e44]
            - list [ref=f7e45]:
              - listitem [ref=f7e46]:
                - paragraph [ref=f7e47]: "01"
                - heading "Prepare" [level=3] [ref=f7e48]
                - paragraph [ref=f7e49]: Your skin is thoroughly cleansed and prepared before treatment. Every Procell session is customized to your skin goals and concerns.
              - listitem [ref=f7e50]:
                - paragraph [ref=f7e51]: "02"
                - heading "The pass" [level=3] [ref=f7e52]
                - paragraph [ref=f7e53]: Treatment depth is adjusted for each area of your skin — deeper where correction is needed and lighter where skin is naturally thinner. A specialized growth factor serum is applied throughout the treatment to support your skin's natural repair process.
              - listitem [ref=f7e54]:
                - paragraph [ref=f7e55]: "03"
                - heading "Recover" [level=3] [ref=f7e56]
                - paragraph [ref=f7e57]: Expect redness similar to a mild sunburn for 24-48 hours. Mild dryness or flaking may occur as your skin renews itself. Following your post-care instructions including daily SPF is essential to support healing and help minimize the risk of unwanted pigmentation, especially in melanin rich skin.
          - generic [ref=f7e58]:
            - heading "Ideal for" [level=2] [ref=f7e59]
            - list [ref=f7e60]:
              - listitem [ref=f7e61]:
                - generic [aria-hidden] [ref=f7e62]: —
                - generic [ref=f7e63]: Acne scars and uneven skin texture
              - listitem [ref=f7e64]:
                - generic [aria-hidden] [ref=f7e65]: —
                - generic [ref=f7e66]: Enlarged pores and rough skin texture
              - listitem [ref=f7e67]:
                - generic [aria-hidden] [ref=f7e68]: —
                - generic [ref=f7e69]: Fine lines and early loss of firmness
              - listitem [ref=f7e70]:
                - generic [aria-hidden] [ref=f7e71]: —
                - generic [ref=f7e72]: Skin that benefits from collagen stimulation without heat or light
        - complementary [ref=f7e73]:
