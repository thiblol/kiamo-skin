          - heading "Three kinds of dark mark, and why one facial cannot fix all three" [level=2] [ref=f15e27]
          - paragraph [ref=f15e28]: Choosing a facial for hyperpigmentation before you know which kind you have is the most common reason treatment fails — and occasionally the reason it backfires.
