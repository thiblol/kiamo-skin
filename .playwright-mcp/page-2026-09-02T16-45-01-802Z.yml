          - heading "June gloom is not sun protection" [level=2] [ref=f15e34]
          - paragraph [ref=f15e35]: The marine layer is the single most expensive misunderstanding in San Diego skincare. It looks like cover. It is not cover.
      - listitem [ref=f15e36]:
        - link [ref=f15e37] [cursor=pointer]:
