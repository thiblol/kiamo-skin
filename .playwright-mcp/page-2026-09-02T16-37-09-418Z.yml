              - listitem [ref=f6e62]:
                - generic [aria-hidden] [ref=f6e63]: —
                - generic [ref=f6e64]: Skin recovering from over-exfoliation or aggressive at-home products
              - listitem [ref=f6e65]:
                - generic [aria-hidden] [ref=f6e66]: —
