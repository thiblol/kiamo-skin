            - text: · DMK Enzyme Therapy
          - heading "DMK Enzyme Therapy — restore skin function from within." [level=1] [ref=f6e21]
          - paragraph [ref=f6e22]: Looking for DMK enzyme therapy in San Diego? Level 1 is $279 at the KIAMO SKIN studio in Mission Hills, and it is the treatment used when a barrier is too compromised to tolerate anything stronger.
          - paragraph [ref=f6e23]:
            - text: DMK Enzyme Therapy is designed to restore healthy skin function rather than simply exfoliating the surface. By supporting the skin's natural processes, it helps strengthen the skin barrier while encouraging healthy circulation and lymphatic activity. It's especially beneficial for skin that feels over-exfoliated, sensitized, inflamed, or slow to heal—common states for
            - link "Encinitas surfers" [ref=f6e24] [cursor=pointer]:
              - /url: /service-areas/encinitas/
            - text: ","
            - link "Pacific Beach residents" [ref=f6e25] [cursor=pointer]:
              - /url: /service-areas/pacific-beach/
            - text: ", and anyone whose barrier has been stripped by salt water, wind, or aggressive product use."
          - generic [ref=f6e26]:
            - link "Request Appointment" [ref=f6e27] [cursor=pointer]:
              - /url: https://www.vagaro.com/kiamoskin
            - link "(310) 595-0872" [ref=f6e28] [cursor=pointer]:
              - /url: tel:+13105950872
          - paragraph [ref=f6e29]: Licensed Esthetician · Licensed Esthetician · 7+ years experience · One-to-one, private studio
        - generic [ref=f6e30]:
          - img "An enzyme masque setting during a treatment" [ref=f6e31]
          - link "Request Appointment" [ref=f6e33] [cursor=pointer]:
