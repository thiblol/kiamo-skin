      - paragraph [ref=f6e36]:
        - text: DMK Enzyme Therapy is performed at the Mission Hills studio. Clients travel from
        - link "across San Diego County" [ref=f6e37] [cursor=pointer]:
          - /url: /service-areas/
        - text: — from nearby neighborhoods like North Park and Hillcrest to coastal areas including La Jolla, Pacific Beach and Encinitas, and inland communities like Chula Vista and La Mesa.
      - generic [ref=f6e39]:
        - generic [ref=f6e40]:
          - generic [ref=f6e41]:
            - heading "What happens in the room" [level=2] [ref=f6e42]
            - list [ref=f6e43]:
              - listitem [ref=f6e44]:
                - paragraph [ref=f6e45]: "01"
                - heading "Assess" [level=3] [ref=f6e46]
                - paragraph [ref=f6e47]: Every DMK treatment is customized to what your skin needs that day — not a fixed protocol.
              - listitem [ref=f6e48]:
                - paragraph [ref=f6e49]: "02"
                - heading "The masque" [level=3] [ref=f6e50]
                - paragraph [ref=f6e51]: As the enzyme masque sets, you will feel a tightening and rhythmic pulsing sensation. This is an expected part of the treatment and varies from person to person.
              - listitem [ref=f6e52]:
                - paragraph [ref=f6e53]: "03"
                - heading "Home care" [level=3] [ref=f6e54]
                - paragraph [ref=f6e55]: DMK is designed as a complete system. Your personalized home routine supports the work done in the treatment room, helping you achieve the best possible results between visits.
          - generic [ref=f6e56]:
            - heading "Ideal for" [level=2] [ref=f6e57]
            - list [ref=f6e58]:
