        - paragraph [ref=e96]:
          - text: Chemical peels in San Diego cost $150 to $350 at an esthetician studio, with the real price driver being the practitioner's training and the peel's formulation for your skin tone. On melanin-rich skin, the provider matters more than the acid. If you're dealing with pigmentation and want to understand which peel makes sense for your concern,
