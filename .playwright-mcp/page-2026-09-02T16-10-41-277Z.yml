              - /url: /journal/june-gloom-is-not-sun-protection/
              - heading "June gloom is not sun protection" [level=3] [ref=e145]
              - paragraph [ref=e146]: The marine layer is the single most expensive misunderstanding in San Diego skincare. It looks like cover. It is not cover.
          - listitem [ref=e147]:
            - link [ref=e148] [cursor=pointer]:
              - /url: /journal/san-diego-hard-water-and-your-scalp/
              - heading "San Diego hard water and your scalp" [level=3] [ref=e149]
              - paragraph [ref=e150]: If your scalp flakes, itches, or feels coated no matter what shampoo you buy, the shampoo may not be the variable worth changing.
          - listitem [ref=e151]:
            - link [ref=e152] [cursor=pointer]:
              - /url: /journal/microneedling-on-dark-skin-san-diego/
              - heading "Microneedling on dark skin, and why depth decides the outcome" [level=3] [ref=e153]
              - paragraph [ref=e154]: The question is not really whether needling works on melanin-rich skin. It is whether the person holding the device has set the depth for the skin in front of them.
          - listitem [ref=e155]:
            - link [ref=e156] [cursor=pointer]:
              - /url: /journal/dermaplaning-safe-dark-skin-san-diego/
              - heading "Is dermaplaning safe for dark skin? Here is what actually matters." [level=3] [ref=e157]
              - paragraph [ref=e158]: The question is not really whether dermaplaning works on darker skin. It is whether the blade angle and pressure match the skin in front of it.
          - listitem [ref=e159]:
            - link [ref=e160] [cursor=pointer]:
              - /url: /journal/dandruff-treatment-san-diego/
              - 'heading "Professional Scalp Treatment San Diego: Keravive for Dandruff, Flaking & Hair Health" [level=3] [ref=e161]'
              - paragraph [ref=e162]: Looking for professional scalp treatment in San Diego? KIAMO SKIN offers Keravive therapy for dandruff, seborrheic dermatitis, dry scalp, and hair thinning. While over-the-counter shampoos treat surface symptoms, Keravive addresses the root cause.
          - listitem [ref=e163]:
            - link [ref=e164] [cursor=pointer]:
              - /url: /journal/san-diego-scalp-treatments-how-keravive-works/
              - 'heading "San Diego Scalp Treatments: How Does Keravive Work?" [level=3] [ref=e165]'
              - paragraph [ref=e166]: Keravive is a clinical scalp treatment designed to remove years of product buildup, hard water minerals, and oil congestion that shampoo can't reach. For San Diego residents dealing with ocean humidity, hard water, and year-round sun exposure, it addresses the root causes of flaking, tightness, and hair thinning.
          - listitem [ref=e167]:
            - link [ref=e168] [cursor=pointer]:
              - /url: /journal/hyperpigmentation-treatment-guide/
              - 'heading "Hyperpigmentation Treatment Guide: What Actually Works for Dark Spots, Melasma & PIH" [level=3] [ref=e169]'
              - paragraph [ref=e170]: If you have struggled with stubborn dark spots, melasma, or uneven skin tone in San Diego, the right combination of professional treatments and medical-grade home care can produce dramatic improvement—but only if the approach is calibrated for your skin tone and pigmentation type.
