          - heading "How much does a chemical peel cost in San Diego?" [level=1] [ref=e20]
          - paragraph [ref=e21]: The price of a chemical peel in San Diego varies by depth, formulation, and whether it is part of a treatment series — but the more important question is which one your skin actually needs.
        - img "Licensed esthetician applying Lira chemical peel to a client's cheek using a fan brush in a softly lit treatment room" [ref=e22]
      - generic [ref=e25]:
        - paragraph [ref=e26]:
          - text: "You've been Googling it for a week. Every result gives a range so wide it's useless—$75 to $3,000 is a real number you'll find online—and none of them answer what you're actually asking: is it safe on your skin, and will it do anything? If you're in San Diego and considering a"
          - link "chemical peel in San Diego" [ref=e27] [cursor=pointer]:
            - /url: /treatments/lira-peels/
          - text: ", this article gives you the real local numbers, not national averages, and addresses the safety question most articles skip entirely."
        - heading "How much does a chemical peel cost in San Diego?" [level=2] [ref=e28]
        - paragraph [ref=e29]: A chemical peel in San Diego costs between $150 and $350 at an esthetician studio, $300 to $800 at a medspa or dermatology clinic, and $1,000 to $3,000 for deep phenol peels performed by a plastic surgeon. The range exists because light, medium, and deep peels are completely different procedures with different risk profiles and results.
