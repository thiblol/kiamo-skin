      - paragraph [ref=f9e37]:
        - text: Dermaplane Facial is performed at the Mission Hills studio. Clients travel from
        - link "across San Diego County" [ref=f9e38] [cursor=pointer]:
          - /url: /service-areas/
        - text: — from nearby neighborhoods like North Park and Hillcrest to coastal areas including La Jolla, Pacific Beach and Encinitas, and inland communities like Chula Vista and La Mesa.
      - generic [ref=f9e40]:
        - generic [ref=f9e41]:
          - generic [ref=f9e42]:
            - heading "What happens in the room" [level=2] [ref=f9e43]
            - list [ref=f9e44]:
              - listitem [ref=f9e45]:
                - paragraph [ref=f9e46]: "01"
                - heading "Cleanse and dry" [level=3] [ref=f9e47]
                - paragraph [ref=f9e48]: The skin is cleansed and taken completely dry. Dermaplaning is performed on a dry surface — any residual moisture changes how the blade sits.
              - listitem [ref=f9e49]:
                - paragraph [ref=f9e50]: "02"
                - heading "The pass" [level=3] [ref=f9e51]
                - paragraph [ref=f9e52]: The blade is held at a fixed angle and drawn across the skin in short, controlled strokes, section by section. Active or pustular acne is worked around rather than over.
              - listitem [ref=f9e53]:
                - paragraph [ref=f9e54]: "03"
                - heading "Treat and protect" [level=3] [ref=f9e55]
                - paragraph [ref=f9e56]: With the surface barrier of dead cells removed, serums are applied while absorption is at its highest, and the treatment closes with SPF.
          - generic [ref=f9e57]:
            - heading "Ideal for" [level=2] [ref=f9e58]
            - list [ref=f9e59]:
              - listitem [ref=f9e60]:
                - generic [aria-hidden] [ref=f9e61]: —
                - generic [ref=f9e62]: Rough or uneven surface texture
              - listitem [ref=f9e63]:
                - generic [aria-hidden] [ref=f9e64]: —
                - generic [ref=f9e65]: Makeup that clings to fine facial hair
              - listitem [ref=f9e66]:
                - generic [aria-hidden] [ref=f9e67]: —
                - generic [ref=f9e68]: Skincare that seems to sit on the surface instead of absorbing
              - listitem [ref=f9e69]:
                - generic [aria-hidden] [ref=f9e70]: —
                - generic [ref=f9e71]: Anyone wanting a corrective treatment with no recovery time
        - complementary [ref=f9e72]:
          - generic [ref=f9e73]:
            - heading "Pricing in San Diego" [level=2] [ref=f9e74]
            - generic [ref=f9e76]:
              - term [ref=f9e77]: Dermaplane Facial
              - definition [ref=f9e78]: $199
              - definition [ref=f9e79]: A full facial with dermaplaning included — cleanse, dermaplane, treat and protect. Often paired with a peel, because a cleared surface lets the acid work evenly.
            - paragraph [ref=f9e80]: Dermaplaning is not appropriate over active or inflamed acne, and it is skipped in those areas. Vellus hair grows back exactly as it was — same texture, same colour. It cannot grow back thicker, because the blade does not touch the follicle.
