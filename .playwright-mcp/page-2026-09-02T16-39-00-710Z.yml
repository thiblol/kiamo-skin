            - link "Treatments" [ref=f9e20] [cursor=pointer]:
              - /url: /treatments/
            - text: · Dermaplane Facial
          - heading "Dermaplaning — a clean surface changes what everything else can do." [level=1] [ref=f9e21]
          - paragraph [ref=f9e22]: Looking for dermaplaning in San Diego? The dermaplane facial at KIAMO SKIN is performed by a licensed esthetician in Mission Hills, and it is $199.
          - paragraph [ref=f9e23]:
            - text: "Dermaplaning uses a sterile surgical blade to remove dead surface cells and the fine vellus hair that sits on top of them. Nothing is pulled from the follicle and nothing penetrates the skin. What changes is the surface: product reaches live tissue instead of sitting on debris, and makeup stops catching on texture. Clients from"
            - link "Mission Hills" [ref=f9e24] [cursor=pointer]:
              - /url: /service-areas/mission-hills/
            - text: ","
            - link "North Park" [ref=f9e25] [cursor=pointer]:
              - /url: /service-areas/north-park/
            - text: ", and"
            - link "La Jolla" [ref=f9e26] [cursor=pointer]:
              - /url: /service-areas/la-jolla/
            - text: book dermaplaning for events and before important occasions because there is zero downtime and the glow is immediate.
          - generic [ref=f9e27]:
            - link "Request Appointment" [ref=f9e28] [cursor=pointer]:
              - /url: https://www.vagaro.com/kiamoskin
            - link "(310) 595-0872" [ref=f9e29] [cursor=pointer]:
              - /url: tel:+13105950872
          - paragraph [ref=f9e30]: Licensed Esthetician · Licensed Esthetician · 7+ years experience · One-to-one, private studio
        - generic [ref=f9e31]:
