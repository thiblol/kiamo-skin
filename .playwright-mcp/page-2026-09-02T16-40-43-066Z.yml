      - generic [ref=f12e152]:
        - generic [ref=f12e153]:
          - paragraph [ref=f12e154]: Every plan includes
          - heading "What being a member actually changes" [level=2] [ref=f12e155]
        - list [ref=f12e156]:
          - listitem [ref=f12e157]:
            - heading "One personalized treatment every month" [level=3] [ref=f12e158]
            - paragraph [ref=f12e159]: Selected for what your skin is doing that month, not booked as the same protocol on repeat.
          - listitem [ref=f12e160]:
            - heading "15% off retail" [level=3] [ref=f12e161]
            - paragraph [ref=f12e162]: Home care is most of the result. The routine between visits is what the treatments are protecting.
          - listitem [ref=f12e163]:
            - heading "Priority booking" [level=3] [ref=f12e164]
            - paragraph [ref=f12e165]: One licensed esthetician, appointment-only. Members are offered times first.
          - listitem [ref=f12e166]:
            - heading "Upgrade by paying the difference" [level=3] [ref=f12e167]
            - paragraph [ref=f12e168]: Apply the value of your monthly treatment to any eligible advanced service and pay only the gap.
          - listitem [ref=f12e169]:
            - heading "Progress assessments at no charge" [level=3] [ref=f12e170]
            - paragraph [ref=f12e171]: Skin is photographed and reviewed against where it started, so the plan is adjusted on evidence.
          - listitem [ref=f12e172]:
            - heading "Member pricing on select treatments" [level=3] [ref=f12e173]
            - paragraph [ref=f12e174]: On enhancements and add-ons beyond what the monthly treatment already covers.
          - listitem [ref=f12e175]:
            - heading "Early access and member events" [level=3] [ref=f12e176]
            - paragraph [ref=f12e177]: New treatments, new products and member-only evenings, before they are announced publicly.
          - listitem [ref=f12e178]:
            - heading "Gift a month to one guest" [level=3] [ref=f12e179]
            - paragraph [ref=f12e180]: An unused monthly treatment can go to one guest. They book through Vagaro under their own account.
      - generic [ref=f12e183]:
        - paragraph [ref=f12e184]: The arithmetic
        - heading "The same two treatments, in the same room" [level=2] [ref=f12e185]
        - paragraph [ref=f12e186]: A HydraFacial and a dermaplane facial are the two most-booked treatments here. This is what they cost separately, and what they cost together on the LUX membership.
        - generic [ref=f12e187]:
          - generic [ref=f12e188]:
