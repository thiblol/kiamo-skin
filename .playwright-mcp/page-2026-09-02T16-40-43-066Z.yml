      - generic [ref=f12e16]:
        - generic [ref=f12e17]:
          - paragraph [ref=f12e18]: Membership
          - heading "Skin doesn’t keep results. It rebuilds them." [level=1] [ref=f12e19]
          - paragraph [ref=f12e20]: Looking for a monthly facial membership in San Diego? KIAMO SKIN memberships start at $199 a month at the studio in Mission Hills — against $259 for the same HydraFacial booked one visit at a time.
          - paragraph [ref=f12e21]: Every treatment on this menu is chosen to change something. What none of them can do is hold that change alone, because the skin you are treating today will have replaced itself before the next appointment. A membership is how the work compounds instead of resetting.
          - generic [ref=f12e22]:
            - link "See the plans" [ref=f12e23] [cursor=pointer]:
              - /url: "#plans"
            - link "(310) 595-0872" [ref=f12e24] [cursor=pointer]:
              - /url: tel:+13105950872
        - img "Monthly HydraFacial membership treatment at KIAMO Skin studio in Mission Hills, San Diego" [ref=f12e25]
      - generic [ref=f12e27]:
        - generic [ref=f12e28]:
          - paragraph [ref=f12e29]: What it is
          - heading "What is a facial membership?" [level=2] [ref=f12e30]
        - generic [ref=f12e32]:
          - paragraph [ref=f12e33]: A facial membership—sometimes called a skincare membership or facial subscription—is a monthly plan that provides regular corrective treatments at a fixed rate. Unlike buying facials one at a time, a monthly facial membership ensures consistency, which is how skin correction actually works.
          - paragraph [ref=f12e34]: At KIAMO SKIN, facial memberships start at $199 per month for a monthly HydraFacial in Mission Hills, San Diego—against $259 for the same treatment booked individually. The value is in the rhythm, not just the discount.
      - generic [ref=f12e36]:
        - generic [ref=f12e37]:
          - paragraph [ref=f12e38]: Why monthly
          - heading "Your skin is slower than San Diego spas say it is" [level=2] [ref=f12e39]
        - generic [ref=f12e40]:
          - generic [ref=f12e41]:
            - paragraph [ref=f12e42]:
              - text: Almost every spa in San Diego will tell you skin renews on a 28-day cycle. The primary research does not say that. Reviewing the human data,
              - link "epidermal turnover is estimated at 40 to 56 days" [ref=f12e43] [cursor=pointer]:
                - /url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2861991/
              - text: ", and a compartment-by-compartment recalculation of the same measurements"
              - link "puts it at 47 to 48 days" [ref=f12e44] [cursor=pointer]:
                - /url: https://pubmed.ncbi.nlm.nih.gov/7865480/
              - text: . It slows further with age.
            - paragraph [ref=f12e45]: That single correction changes the entire arithmetic of booking facials. A treatment every three or four months does not land in the next cycle — it lands two cycles later, on skin that has completely replaced the skin that was treated. Nothing accumulates. You are paying full price to start again, and then judging the treatment for not working.
            - paragraph [ref=f12e46]:
              - text: A monthly rhythm sits inside the cycle rather than outside it. Each visit works on skin the last visit already changed, which is the only condition under which correction is cumulative. It is also why the
              - link "peel pages here say there is no single-session version of pigmentation work" [ref=f12e47] [cursor=pointer]:
                - /url: /treatments/lira-peels/
              - text: ", and why scalp therapy is priced as a series. The membership is not a new idea. It is the delivery mechanism for what this studio has been saying since the day it opened."
          - figure "Back congestion and pigmentation, across a course of treatment. Results vary." [ref=f12e49]:
            - img "Back congestion and pigmentation before and after a course of treatment at KIAMO Skin" [ref=f12e50]
