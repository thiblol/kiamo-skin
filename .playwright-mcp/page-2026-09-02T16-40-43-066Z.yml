      - generic [ref=f12e206]:
        - generic [ref=f12e207]:
          - paragraph [ref=f12e208]: Flexibility
          - heading "When life gets in the way" [level=2] [ref=f12e209]
          - paragraph [ref=f12e210]: A membership you cannot use is not a saving. These are the four things that actually go wrong, and what happens in each case.
        - list [ref=f12e211]:
          - listitem [ref=f12e212]:
            - paragraph [ref=f12e213]: "01"
            - heading "What if I miss a month?" [level=3] [ref=f12e214]
            - paragraph [ref=f12e215]: The treatment rolls over and your membership stays active. Up to three can be banked at once — past that the point of a monthly rhythm is gone, and a plan you are three months behind on is a plan that is not working.
          - listitem [ref=f12e216]:
            - paragraph [ref=f12e217]: "02"
            - heading "What if I want something more advanced?" [level=3] [ref=f12e218]
            - paragraph [ref=f12e219]: Apply the value of your monthly treatment to any eligible advanced service and pay only the difference. A Procell series or an advanced peel can be run on a membership rather than instead of one.
          - listitem [ref=f12e220]:
            - paragraph [ref=f12e221]: "03"
            - heading "What if I cannot use it this month?" [level=3] [ref=f12e222]
            - paragraph [ref=f12e223]: Gift it 1x to one guest. They create a Vagaro account and book their own appointment. It is one guest per treatment, so it stays a gift rather than becoming a second membership.
          - listitem [ref=f12e224]:
            - paragraph [ref=f12e225]: "04"
            - heading "What if life gets in the way entirely?" [level=3] [ref=f12e226]
            - paragraph [ref=f12e227]: Memberships cannot be paused but may be canceled after the 6 month and restarted later, subject to current availability and pricing.
      - generic [ref=f12e231]:
        - paragraph [ref=f12e232]: The commitment
        - heading "Six months is four renewal cycles" [level=2] [ref=f12e233]
        - paragraph [ref=f12e234]: Membership begins with a six-month commitment, and that is the part worth explaining rather than hiding.
        - paragraph [ref=f12e235]: At 40 to 56 days a cycle, six months is roughly four complete turnovers of the skin being treated. Three months is two — enough to change surface texture, rarely enough to move pigmentation or scarring, which are the two things most people arrive here for. A commitment shorter than the biology would be easier to sell and would set you up to conclude the treatment failed.
        - paragraph [ref=f12e236]: After six months the membership continues month to month and you may cancel your membership. I just need a 30 day notice before the next month to month cycle. Text or email.
      - generic [ref=f12e238]:
        - generic [ref=f12e239]:
          - paragraph [ref=f12e240]: What you are buying
          - heading "Your first three months" [level=2] [ref=f12e241]
        - list [ref=f12e242]:
          - listitem [ref=f12e243]:
            - paragraph [ref=f12e244]: Month one
            - heading "Baseline and barrier" [level=3] [ref=f12e245]
            - paragraph [ref=f12e246]: Nothing corrective happens until the barrier can take it. The first month establishes what the skin is actually doing, photographs it, and starts the home routine that everything after depends on.
          - listitem [ref=f12e247]:
            - paragraph [ref=f12e248]: Month two
            - heading "Correction begins" [level=3] [ref=f12e249]
            - paragraph [ref=f12e250]: With the barrier holding, the work starts — congestion, pigmentation, texture or scarring, whichever the assessment identified. Strength escalates across visits rather than inside one.
          - listitem [ref=f12e251]:
            - paragraph [ref=f12e252]: Month three
            - heading "Assessment against month one" [level=3] [ref=f12e253]
            - paragraph [ref=f12e254]: Your skin is reviewed against its own starting photographs, not against anybody else. What is working continues, what is not gets changed. This is the point a plan either earns the next three months or is rewritten.
