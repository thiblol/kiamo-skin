    - generic [ref=e387]:
      - paragraph [ref=e388]: Treating skin in San Diego
      - heading "Your San Diego climate is part of your protocol." [level=2] [ref=e389]
      - list [ref=e390]:
        - listitem [ref=e391]:
          - img "Overcast San Diego coastline under a bright marine layer" [ref=e392]
          - heading "June gloom is not sun protection" [level=3] [ref=e393]
          - paragraph [ref=e394]: The marine layer scatters light, it does not stop it. UV still reaches 8–10 on the index through overcast mornings, which is exactly how pigmentation quietly deepens in a city that feels mild.
          - link "Read the article" [ref=e395] [cursor=pointer]:
            - /url: /journal/june-gloom-is-not-sun-protection/
        - listitem [ref=e396]:
          - img "Water falling over a hand, lit from the side" [ref=e397]
          - heading "Hard water, dry scalp" [level=3] [ref=e398]
          - paragraph [ref=e399]: San Diego water runs around 16 grains per gallon — hard by any measure. Mineral residue builds on the scalp and hair, which shows up as flaking, itch and product that stops working.
          - link "Read the article" [ref=e400] [cursor=pointer]:
            - /url: /journal/san-diego-hard-water-and-your-scalp/
        - listitem [ref=e401]:
          - img "Portrait in dry, warm light with visible natural skin texture" [ref=e402]
          - heading "Santa Ana winds and your barrier" [level=3] [ref=e403]
          - paragraph [ref=e404]: Humidity can drop into single digits within hours. A compromised barrier loses water faster than it can hold it, and skin that was calm all summer starts stinging in October.
          - link "See barrier repair" [ref=e405] [cursor=pointer]:
            - /url: /treatments/dmk-enzyme-therapy/
